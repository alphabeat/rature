# HTML must be revalidated so a deploy is picked up; hashed assets are cached below.
map $sent_http_content_type $html_cache_control {
    ~^text/html "no-cache";
    default     "";
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Cache-Control $html_cache_control always;

    location / {
        # Public routes are prerendered (`/about` -> `about/index.html`, no redirect to `/about/`).
        try_files $uri $uri/index.html =404;
    }

    location ~ ^/(processing|document|settings)(/|$) {
        # App routes are client-only: they get the SPA shell.
        try_files /__spa-fallback.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
